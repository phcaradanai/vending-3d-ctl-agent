version: "3.9"

networks:
  vending_net:
    driver: bridge
services:
  logger-monitor:
      image: registry.rd.ns.co.th/httpd:latest
      networks:
        - vending_net
      environment:
        TZ: "Asia/Bangkok"
      ports:
        - "6810:80"  
      volumes:
        - /opt/docker/vending:/usr/local/apache2/htdocs 
      restart: always
      
  vending-3d-ctl:
    image: registry.rd.ns.co.th/chularat3inter/vending-3d-ctl:latest
    # pull_policy: always
    container_name: vending-3d-ctl
    restart: unless-stopped
    networks:
      - vending_net
    ports:
      - "6811:3303"
    volumes:
      - /opt/docker/vending/vending-3d-ctl/logs:/app/logs
    privileged: true
    devices:
      - /dev/ttyS0:/dev/ttyS0 # vending
      - /dev/ttyS1:/dev/ttyS1 # sticker camera / QR reader
      - /dev/ttyS2:/dev/ttyS2 
      - /dev/ttyS3:/dev/ttyS3
      - /dev/ttyUSB0:/dev/ttyUSB0 # LED
      - /dev/ttyUSB1:/dev/ttyUSB1 # QR
      # - /dev/ttyS0:/dev/ttyS0
      # - /dev/ttyS1:/dev/ttyS1 
      # - /dev/ttyS2:/dev/ttyS2
      # - /dev/ttyS3:/dev/ttyS3
      # - /dev/ttyS4:/dev/ttyS4 # vending
      # - /dev/ttyS5:/dev/ttyS5 # composesser
      
    environment:
      # --- HTTP ---
      PORT: 3303

      # --- API Security ---
      API_BEARER_TOKEN: "${API_BEARER_TOKEN}"
      API_BEARER_REQUIRED: "true"

      # --- Identity ---
      CUSTOMER_CODE: "wnyh"
      VENDING_CODE: "${VENDING_CODE:-00010001}"
      # Immutable kiosk code used in every scanner event sent to Core.
      KIOSK_CODE: "${KIOSK_CODE:-00010001}"
      DOOR_TYPE_STANDBY: "[1,2,3]"
      DOOR_TYPE_NOW: "[1,2,3]"

      # --- Timezone & Logs ---
      APP_TIMEZONE: "Asia/Bangkok"
      API_LOG_RETENTION_DAYS: "30"

      # --- JSON log agent ---
      APP_LOG_AGENT_ENABLED: "true"
      APP_LOG_RETENTION_DAYS: "30"
      APP_LOG_CHUNK_SIZE: "32M"
      APP_LOG_ROTATED_MAX_TOTAL: "1G"
      APP_LOG_COMPRESS_ROTATED: "false"

      # --- Log view API ---
      APP_LOG_VIEW_API_ENABLED: "false"

      # --- Serial: vending ---
      SERIAL_VENDING: "/dev/ttyS0"
      SERIAL_VENDING_BAUD_RATE: "9600"
      # SERIAL_COMPRESSOR: "/dev/ttyS1"
      # SERIAL_COMPRESSOR_BAUD_RATE: "9600"

      # --- Serial: navigation lights ---
      SERIAL_NAVIGATION_LIGHTS: "/dev/ttyUSB1"
      SERIAL_NAVIGATION_LIGHTS_BAUD_RATE: "115200"

      # --- Serial: QR NFC / sticker camera ---
      SERIAL_QR_NFC: "/dev/ttyS1"
      SERIAL_QR_NFC_BAUD_RATE: "9600"
      SERIAL_QR_NFC_FRAME_IDLE_MS: "80"

      # --- SY600 ---
      SY600_DEVICE_ADDRESS_HEX: "AABBCCDD"
      SY600_USE_CRC16: "true"
    
      # --- Serial policy ---
      SERIAL_WRITE_TIMEOUT_MS: "40000"
      SERIAL_API_TIMEOUT_MS: "42000"
      SERIAL_WRITE_DEBUG: "false"
      SERIAL_PORT_QUEUE_LOG: "true"
      SERIAL_NAVIGATION_LIGHTS_FRAME_DEBUG: "false"
      SERIAL_NAVIGATION_LIGHTS_WRITE_RETRY: "2"
      SERIAL_NAVIGATION_LIGHTS_RETRY_DELAY_MS: "250"

      # --- MQTT ---
      MQTT_ENABLED: "true"
      MQTT_BROKER_URL: "mqtt://rd.ns.co.th:1883"
      MQTT_CLIENT_ID: "vending-3d-ctl"
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_QRNFC_TOPIC: "hm/${CUSTOMER_CODE}/${VENDING_CODE}/reader"
      MQTT_QRNFC_QOS: "0"
      MQTT_QRNFC_RETAIN: "false"
      MQTT_QRNFC_MIFARE_SIGNATURE: "02,FF,01,09,00|02,01,01,09,00"
      MQTT_QRNFC_BARCODE_WNY_SIGNATURE_REGEX: "([0-9a-f\\-]{36})_(\\d{8})_(\\d+)_(\\d+)_(IN|OUT)_(\\d{14})"

      # --- NATS JetStream (Core scanner event path) ---
      # Set NATS_ENABLED=true and NATS_URL=nats://<core-host>:4222 on the
      # hardware PC. The default keeps local development safe/offline.
      NATS_ENABLED: "${NATS_ENABLED:-false}"
      NATS_URL: "${NATS_URL:-nats://127.0.0.1:4222}"
      NATS_SCANNER_SUBJECT: "medisync.scanner.read"
      NATS_SCANNER_STREAM: "MEDISYNC"



      
