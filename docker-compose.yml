# Local build: builds the image from this repo and runs the API.
#
#   docker compose up -d --build
#   docker compose logs -f
#
# Requires `.env` in the project root (copy from `.env.example`). Host `PORT` must match
# the container port mapping (default 3303).
#
# Logs + rotated files: bind-mount `./logs` → `/app/logs` (same as `docker run -v ./logs:/app/logs`).

services:
  vending-3d-ctl:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${VENDING_CTL_IMAGE_LOCAL:-vending-3d-ctl:local}
    container_name: vending-3d-ctl
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3303}:${PORT:-3303}"
    volumes:
      - ./logs:/app/logs
    # Linux hosts: map serial devices and optionally raise privileges (uncomment as needed).
    # privileged: true
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    #   - /dev/ttyUSB1:/dev/ttyUSB1
    #   - /dev/ttyUSB2:/dev/ttyUSB2
