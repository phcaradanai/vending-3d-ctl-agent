<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manual Test Console</title>
    <link rel="stylesheet" href="/manual-test/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="kicker">vending-3d-ctl-agent</p>
        <h1>Manual Test Console</h1>
      </div>
      <div class="connection-strip" aria-label="Connection settings">
        <label class="field compact">
          <span>Base URL</span>
          <input id="baseUrlInput" type="url" spellcheck="false" />
        </label>
        <label class="field compact token-field">
          <span>Bearer token</span>
          <input id="tokenInput" type="password" autocomplete="off" spellcheck="false" />
        </label>
        <button id="refreshHealthButton" class="button secondary" type="button">Refresh</button>
      </div>
    </header>

    <section class="status-band" aria-label="Status overview">
      <div class="status-item" id="systemStatus">
        <span class="status-dot" aria-hidden="true"></span>
        <span>System</span>
        <strong>unknown</strong>
      </div>
      <div class="status-item" id="vendingStatus">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Vending</span>
        <strong>unknown</strong>
      </div>
      <div class="status-item" id="navigationStatus">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Navigation lights</span>
        <strong>unknown</strong>
      </div>
      <div class="status-item" id="qrStatus">
        <span class="status-dot" aria-hidden="true"></span>
        <span>QR/NFC</span>
        <strong>unknown</strong>
      </div>
      <div class="status-item" id="mqttStatus">
        <span class="status-dot" aria-hidden="true"></span>
        <span>MQTT</span>
        <strong>unknown</strong>
      </div>
    </section>

    <main class="workspace">
      <aside class="rail" aria-label="Command list">
        <div class="rail-section">
          <h2>Commands</h2>
          <div id="commandList" class="command-list"></div>
        </div>
        <div class="rail-section flow-section">
          <h2>Flows</h2>
          <select id="flowSelect"></select>
          <button id="runFlowButton" class="button primary full" type="button">Run flow</button>
          <div id="flowSteps" class="flow-steps"></div>
        </div>
      </aside>

      <section class="machine-panel" aria-label="Machine focus panel">
        <div class="panel-heading">
          <div>
            <p class="kicker">Focus</p>
            <h2 id="activeCommandTitle">Loading</h2>
          </div>
          <span id="riskBadge" class="risk-badge">read</span>
        </div>

        <div class="machine-shell">
          <div class="machine-topline">
            <div id="ledBar" class="led-bar" aria-label="Navigation light segments"></div>
          </div>

          <div class="machine-body">
            <div class="lift-track" id="liftTrack">
              <span>Lift</span>
              <b id="liftTargetLabel">-</b>
            </div>
            <div class="slot-bank">
              <div class="slot-header">
                <span>Layer</span>
                <span>Channels 0-9</span>
              </div>
              <div id="slotGrid" class="slot-grid" aria-label="Slot grid"></div>
            </div>
            <div class="door-stack">
              <button class="door" data-door="1" type="button">Door 1</button>
              <button class="door" data-door="2" type="button">Door 2</button>
              <button class="door" data-door="3" type="button">Door 3</button>
              <div class="subsystem" id="sensorFocus">Sensors</div>
              <div class="subsystem" id="cabinetLightFocus">Cabinet light</div>
              <div class="subsystem" id="compressorFocus">Compressor</div>
            </div>
          </div>

          <div class="queue-strip" id="queueStrip">
            <span>Queue</span>
            <strong>waiting: -</strong>
            <strong>running: -</strong>
          </div>
        </div>

        <form id="controlForm" class="control-grid"></form>
      </section>

      <section class="io-panel" aria-label="Request and response">
        <div class="tabs">
          <button class="tab is-active" data-tab="request" type="button">Request</button>
          <button class="tab" data-tab="response" type="button">Response</button>
          <button class="tab" data-tab="history" type="button">History</button>
        </div>

        <div class="tab-panel is-active" id="requestTab">
          <div class="request-line">
            <code id="requestMethod">GET</code>
            <code id="requestUrl">/api/v1/health</code>
          </div>
          <textarea id="bodyEditor" spellcheck="false"></textarea>
          <div class="action-row">
            <button id="sendCommandButton" class="button primary" type="button">Send command</button>
            <button id="resetBodyButton" class="button secondary" type="button">Reset body</button>
          </div>
        </div>

        <div class="tab-panel" id="responseTab">
          <div class="response-meta" id="responseMeta">No response yet</div>
          <pre id="responseOutput">{}</pre>
        </div>

        <div class="tab-panel" id="historyTab">
          <div class="action-row">
            <button id="clearHistoryButton" class="button secondary" type="button">Clear</button>
          </div>
          <div id="historyList" class="history-list"></div>
        </div>
      </section>
    </main>

    <script type="module" src="/manual-test/app.js"></script>
  </body>
</html>
